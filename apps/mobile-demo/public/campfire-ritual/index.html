<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d101a" />
    <title>A small fire · ReConnect Ritual</title>
    <link rel="stylesheet" href="./assets/campfire.css" />
  </head>
  <body>
    <main class="stage">
      <div class="scene-frame">
        <canvas id="scene"></canvas>

        <section class="control wind" aria-label="Breeze strength">
          <div class="control-head">
            <label for="wind">Breeze</label>
            <output id="wind-out">—</output>
          </div>
          <input type="range" id="wind" min="0" max="100" step="1" value="18" />
        </section>

        <section class="control fire" aria-label="Fire intensity">
          <div class="control-head">
            <label for="fire">Flame</label>
            <output id="fire-out">—</output>
          </div>
          <input type="range" id="fire" min="0" max="100" step="1" value="55" />
        </section>

        <div class="game-title" aria-hidden="true">
          <span>A small fire</span>
          <small>let the day go</small>
        </div>
      </div>
    </main>

    <script src="./assets/core.js"></script>
    <script src="./assets/signal.js"></script>
    <script src="./assets/scene.js"></script>
    <script src="./assets/flame.js"></script>
    <script src="./assets/prune.js"></script>
    <script src="./assets/debris.js"></script>
    <script src="./assets/main.js"></script>
  </body>
</html>
